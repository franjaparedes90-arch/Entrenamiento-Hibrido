/* FASE / SEMANA / DÍA / OBJETIVO (normas de Javier, sección 12) — se calcula a partir de
 * phase.priority y del week_plan de la semana actual (deload / test de RM / prioridad normal). */
function weekObjectiveLabel_(view) {
  var wp = view.weekPlan;
  if (wp && wp.is_rm_test) return 'Test de RM';
  if (wp && wp.deload) return 'Descarga';
  var p = view.phase && view.phase.priority;
  if (p && (p.fuerza != null || p.hipertrofia != null || p.wod != null)) {
    var parts = [];
    if (Number(p.fuerza) >= 40) parts.push('Fuerza');
    if (Number(p.hipertrofia) >= 30) parts.push('Hipertrofia');
    if (Number(p.wod) >= 20) parts.push('Conditioning');
    if (parts.length) return parts.join(' + ');
  }
  return view.phase.name;
}

function renderHoy(view) {
  var exercisesHtml = (view.exercises || []).map(function (e) {
    var repsLabel = (e.min_reps != null && e.max_reps != null) ? (e.min_reps + '–' + e.max_reps) : esc(e.reps);
    var rirLabel = (e.target_rir_min != null) ? (' · RIR ' + e.target_rir_min + (e.target_rir_max != null && e.target_rir_max !== e.target_rir_min ? '–' + e.target_rir_max : '')) : '';
    return '<div class="ex-item"><span>' + esc(e.exercise_name) + '</span><span class="ex-right">' + e.sets + '×' + repsLabel + rirLabel + ' · ' + esc(weightLabel(e.computed_weight, e.weight_type, e.unit)) + '</span></div>';
  }).join('');
  var wodHtml = view.wod ? '<div class="ex-item"><span>WOD · ' + esc(view.wod.wod_type) + '</span><span class="ex-right">' + view.wod.exercises.length + ' movs.</span></div>' : '';
  if (view.wodScheduledButNotToday) wodHtml += '<div class="hint" style="margin-top:2px;">Hoy no toca WOD (no es día de WOD)</div>';
  var objectiveLabel = weekObjectiveLabel_(view);

  var body;
  if (!view.programDay) {
    body =
      '<div class="pill-row"><span class="pill">Fase: ' + esc(view.phase.name) + '</span><span class="pill">Semana ' + view.weekNumber + ' de ' + view.phase.weeks + '</span><span class="pill">' + esc(objectiveLabel) + '</span></div>' +
      '<div class="h1">Día ' + view.dayNumber + '</div>' +
      '<div class="empty-state">Todavía no hay programación cargada para la semana ' + view.weekNumber + ', día ' + view.dayNumber + '.<br>Impórtala desde <b>Fases → Importar CSV</b> o añádela en la hoja PROGRAM_DAYS / PROGRAM_EXERCISES.</div>';
    el('hoyCta').innerHTML = '<button class="btn btn-secondary" onclick="goScreen(\'fases\')">Ir a Fases</button>';
  } else {
    body =
      '<div class="pill-row"><span class="pill">Fase: ' + esc(view.phase.name) + '</span><span class="pill">Semana ' + view.weekNumber + ' de ' + view.phase.weeks + '</span><span class="pill">' + esc(objectiveLabel) + '</span></div>' +
      '<div class="h1">Día ' + view.dayNumber + ' · ' + esc(view.programDay.day_name) + '</div>' +
      '<p class="sub">' + (view.exercises.length) + ' ejercicios' + (view.wod ? ' + WOD' : '') + '</p>' +
      '<div class="card" onclick="goScreen(\'detalle\'); renderDetalle(APP.today);" style="cursor:pointer;">' +
      '<div class="row-between" style="margin-bottom:10px;"><span class="h2" style="font-size:15px;">Resumen</span><span class="badge badge-info">No iniciado</span></div>' +
      exercisesHtml + wodHtml +
      '</div>' +
      '<div class="hint">Toca la tarjeta para ver el detalle completo</div>';
    el('hoyCta').innerHTML =
      '<button class="btn btn-secondary" onclick="openEditor()">✏️ Editar entrenamiento</button>' +
      '<button class="btn btn-primary" onclick="onStartFromHoyClick()">▶ Iniciar entrenamiento</button>';
  }
  el('hoyContent').innerHTML = body;
}

function onStartFromHoyClick() {
  APP.editorDraft = draftFromToday_(APP.today);
  startSessionFromDraft();
}

/* ============================================================================================
 * 2. DETALLE
 * ==========================================================================================*/

function renderDetalle(view) {
  if (!view.programDay) { el('detalleContent').innerHTML = '<div class="empty-state">Sin programación para hoy.</div>'; return; }
  var html = '<div class="h2">' + esc(view.programDay.day_name) + '</div><p class="sub">Semana ' + view.weekNumber + ' · Día ' + view.dayNumber + '</p>';
  view.exercises.forEach(function (e, i) {
    // 2026-08-26: el prefijo "X% RM →" solo tiene sentido cuando el peso de referencia realmente
    // salió de ese %RM (fuente 'RM' — el PRINCIPAL). Para un accesorio con fuente 'LAST_LOGGED' el
    // número ya no es un % de nada — es lo último que se cargó — así que se etiqueta distinto para
    // no confundir "25% RM → 20kg" (que sugeriría que 20kg ES el 25% del RM, cuando no lo es).
    var weightHtml;
    if (e.weight_type === 'PERCENT_RM' && e.computed_weight_source === 'RM') {
      weightHtml = e.weight_value + '% RM → ' + esc(weightLabel(e.computed_weight, e.weight_type, e.unit));
    } else if (e.computed_weight_source === 'LAST_LOGGED') {
      weightHtml = 'Última vez: ' + esc(weightLabel(e.computed_weight, e.weight_type, e.unit));
    } else {
      weightHtml = esc(weightLabel(e.computed_weight, e.weight_type, e.unit));
    }
    var suggestionHtml = '';
    if (e.progression_suggestion && e.progression_suggestion.action !== 'none') {
      var suggestionLabel = { increase: '▲ Subí el peso', hold: '► Mantené el peso', reduce: '▼ Bajá el peso' }[e.progression_suggestion.action] || '';
      suggestionHtml = '<div class="ex-suggestion ex-suggestion-' + esc(e.progression_suggestion.action) + '" title="' + esc(e.progression_suggestion.reason) + '">' + esc(suggestionLabel) + '</div>';
    }
    html += '<div class="card"><div class="ex-name">' + (i + 1) + ' · ' + esc(e.exercise_name) + '</div>' +
      '<div class="ex-meta">' + e.sets + ' series × ' + esc(e.reps) + ' reps · ' + weightHtml +
      ' · descanso ' + formatMMSS(e.rest_seconds) + (e.notes ? ' · ' + esc(e.notes) : '') + '</div>' + suggestionHtml + '</div>';
  });
  if (view.wod) {
    html += '<div class="card" style="border-color:var(--primary);"><div class="ex-name">WOD · ' + esc(view.wod.wod_type) + '</div>';
    view.wod.exercises.forEach(function (m) {
      html += '<div class="wod-move"><span>' + esc(m.reps) + ' ' + esc(m.exercise_name) + '</span><span>' + esc(weightLabel(m.weight_value, m.weight_type, m.unit)) + '</span></div>';
    });
    html += '</div>';
  }
  el('detalleContent').innerHTML = html;
  el('detalleCta').innerHTML =
    '<button class="btn btn-secondary" onclick="openEditor()">✏️ Editar</button>' +
    '<button class="btn btn-primary" onclick="onStartFromHoyClick()">▶ Iniciar entrenamiento</button>';
}

/* ============================================================================================
 * 3. EDITOR — modifica un "borrador" en memoria; nada se guarda en PROGRAM_* nunca.
 * ==========================================================================================*/

function draftFromToday_(view) {
  return {
    exercises: (view.exercises || []).map(function (e) {
      return { programExerciseId: e.id, exerciseName: e.exercise_name, sets: e.sets, reps: e.reps, weight: e.computed_weight, weightType: e.weight_type, restSeconds: e.rest_seconds, unit: e.unit, notes: e.notes, percentOfMovement: e.percent_of_movement };
    }),
    wodIncluded: !!view.wod,
    wod: view.wod ? { wodType: view.wod.wod_type, structure: view.wod.structure, exercises: view.wod.exercises.slice() } : null
  };
}

function openEditor() {
  if (!APP.editorDraft) APP.editorDraft = draftFromToday_(APP.today);
  renderEditor();
  goScreen('editor');
}

function renderEditor() {
  var d = APP.editorDraft;
  var html = '<div class="banner-warning">Los cambios afectan solo a la sesión de hoy. La programación original no se modifica.</div>';
  d.exercises.forEach(function (ex, i) {
    html += '<div class="card">' +
      '<div class="row-between" style="margin-bottom:8px;"><span class="ex-name">' + (i + 1) + ' · ' + esc(ex.exerciseName) + '</span>' +
      '<span><button class="btn-ghost btn-sm" style="width:auto;padding:4px 8px;" onclick="moveDraftExercise(' + i + ',-1)">↑</button>' +
      '<button class="btn-ghost btn-sm" style="width:auto;padding:4px 8px;" onclick="moveDraftExercise(' + i + ',1)">↓</button></span></div>' +
      '<div class="field mb0"><label>Ejercicio</label><input value="' + esc(ex.exerciseName) + '" onchange="updateDraftField(' + i + ',\'exerciseName\',this.value)"></div>' +
      '<div class="divider"></div>' +
      '<div class="btn-row" style="margin-bottom:10px;">' +
      '<div class="field mb0" style="flex:1;"><label>Series</label><input type="number" value="' + ex.sets + '" onchange="updateDraftField(' + i + ',\'sets\',Number(this.value))"></div>' +
      '<div class="field mb0" style="flex:1;"><label>Reps</label><input value="' + esc(ex.reps) + '" onchange="updateDraftField(' + i + ',\'reps\',this.value)"></div>' +
      '</div>' +
      '<div class="btn-row" style="margin-bottom:10px;">' +
      '<div class="field mb0" style="flex:1;"><label>Peso (' + esc(ex.unit || 'kg') + ')</label><input type="number" step="0.5" value="' + (ex.weight || 0) + '" onchange="updateDraftField(' + i + ',\'weight\',Number(this.value))"></div>' +
      '<div class="field mb0" style="flex:1;"><label>Descanso (seg)</label><input type="number" value="' + ex.restSeconds + '" onchange="updateDraftField(' + i + ',\'restSeconds\',Number(this.value))"></div>' +
      '</div>' +
      '<div class="field mb0"><label>Notas</label><input value="' + esc(ex.notes || '') + '" onchange="updateDraftField(' + i + ',\'notes\',this.value)"></div>' +
      '<div class="btn-row" style="margin-top:12px;"><button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="removeDraftExercise(' + i + ')">Omitir de hoy</button></div>' +
      '</div>';
  });
  html += '<button class="btn btn-secondary" onclick="addDraftExercise()">＋ Añadir ejercicio</button>';

  if (d.wod) {
    html += '<div class="section-label">WOD</div><div class="card">' +
      '<div class="row-between"><span class="ex-name">' + esc(d.wod.wodType) + '</span>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-soft);">Incluir hoy <button class="toggle ' + (d.wodIncluded ? '' : 'off') + '" onclick="toggleDraftWod()"></button></label></div>';
    d.wod.exercises.forEach(function (m, i) {
      html += '<div class="wod-move"><input style="border:none;background:transparent;font-size:14.5px;width:60%;" value="' + esc(m.exercise_name) + '" onchange="updateDraftWodMove(' + i + ',\'exercise_name\',this.value)">' +
        '<input style="border:none;background:transparent;font-size:14.5px;width:35%;text-align:right;" value="' + esc(m.reps) + '" onchange="updateDraftWodMove(' + i + ',\'reps\',this.value)"></div>';
    });
    html += '</div>';
  }
  el('editorContent').innerHTML = html;
}

function updateDraftField(i, field, value) { APP.editorDraft.exercises[i][field] = value; }
function moveDraftExercise(i, dir) {
  var arr = APP.editorDraft.exercises; var j = i + dir;
  if (j < 0 || j >= arr.length) return;
  var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  renderEditor();
}
function removeDraftExercise(i) { APP.editorDraft.exercises.splice(i, 1); renderEditor(); }
function addDraftExercise() {
  APP.editorDraft.exercises.push({ exerciseName: 'Nuevo ejercicio', sets: 3, reps: '10', weight: 0, weightType: 'ABSOLUTE_KG', restSeconds: 60, unit: 'kg', notes: '' });
  renderEditor();
}
function toggleDraftWod() { APP.editorDraft.wodIncluded = !APP.editorDraft.wodIncluded; renderEditor(); }
function updateDraftWodMove(i, field, value) { APP.editorDraft.wod.exercises[i][field] = value; }

function onStartSessionClick() { startSessionFromDraft(); }

function startSessionFromDraft() {
  var d = APP.editorDraft;
  if (!d || d.exercises.length === 0) { showError(new Error('Añade al menos un ejercicio antes de empezar.')); return; }
  showLoading();
  var planWod = (d.wodIncluded && d.wod) ? { wodType: d.wod.wodType, structure: d.wod.structure } : null;
  gs('startSession', d.exercises, planWod, '').then(function (res) {
    APP.currentSessionId = res.sessionId;
    APP.editorDraft = null;
    requestWakeLock_();
    return loadCalentamiento_();
  }).catch(showError).then(hideLoading);
}

/* ============================================================================================
 * 4. CALENTAMIENTO
 * ==========================================================================================*/

function loadCalentamiento_() {
  // Refresca el estado de la sesión ANTES de pintar el calentamiento: si no, el cronómetro
  // global se queda fijo en 00:00 porque tickGlobalClock_ no tiene APP.sessionState todavía.
  return refreshSessionState_().then(function () {
    var warmup = APP.today && APP.today.warmup;
    renderCalentamiento(warmup);
    goScreen('calentamiento');
  });
}

var warmupChecks = {};
function renderCalentamiento(warmup) {
  warmupChecks = {};
  var sectionLabel = { MOVILIDAD_ARTICULAR: 'Movilidad articular', ACTIVACION_GENERAL: 'Activación general', ACTIVACION_ESPECIFICA: 'Activación específica' };
  var html = '<div class="session-clock" id="calSessionClock">⏱ Sesión 00:00</div>';
  if (!warmup) {
    html += '<div class="empty-state">No hay calentamiento configurado para este día.</div>';
  } else {
    ['MOVILIDAD_ARTICULAR', 'ACTIVACION_GENERAL', 'ACTIVACION_ESPECIFICA'].forEach(function (sec) {
      var items = warmup[sec] || [];
      if (items.length === 0) return;
      html += '<div class="h2">' + sectionLabel[sec] + '</div><div class="card">';
      items.forEach(function (it, i) {
        var key = sec + '_' + i;
        html += '<div class="warm-item" onclick="toggleWarmupItem(\'' + key + '\')"><div class="check-circle" id="wu_' + key + '">✓</div><div><b>' + esc(it.name) + '</b><div class="ex-meta">' + esc(it.reps_or_duration) + '</div></div></div>';
      });
      html += '</div>';
    });
  }
  el('calentamientoContent').innerHTML = html;
  startGlobalClockTicker_('calSessionClock');
}
function toggleWarmupItem(key) {
  warmupChecks[key] = !warmupChecks[key];
  el('wu_' + key).classList.toggle('done', !!warmupChecks[key]);
}

/* ============================================================================================
 * Cronómetro global de sesión
 * ==========================================================================================*/

function startGlobalClockTicker_(targetElId) {
  clearInterval(APP.timers.global);
  tickGlobalClock_(targetElId);
  APP.timers.global = setInterval(function () { tickGlobalClock_(targetElId); }, 1000);
}
function stopGlobalClockTicker_() { clearInterval(APP.timers.global); }
function tickGlobalClock_(targetElId) {
  if (!APP.sessionState) return;
  var s = APP.sessionState.session;
  var elapsed = Number(APP.sessionState.activeElapsedSeconds) || 0;
  if (s.status === 'IN_PROGRESS' && s.last_resume_time) {
    elapsed += Math.round((Date.now() - new Date(s.last_resume_time).getTime()) / 1000);
  }
  var t = el(targetElId);
  if (t) t.textContent = '⏱ Sesión ' + formatMMSS(elapsed);
}

function refreshSessionState_() {
  return gs('getSessionState', APP.currentSessionId).then(function (state) {
    APP.sessionState = state;
    return state;
  });
}

/* ============================================================================================
 * 5. EJERCICIO ACTIVO
 * ==========================================================================================*/

function goToCurrentStep() {
  showLoading();
  refreshSessionState_().then(function (state) {
    if (state.rest) { renderDescanso(state.rest); goScreen('descanso'); return; }
    if (!state.current) {
      // no quedan ejercicios pendientes: toca WOD si existe y no está terminado, o resultado
      if (state.wod && state.wod.status !== 'COMPLETED' && state.wod.status !== 'SKIPPED') { openWod(); return; }
      finishAndShowResult_();
      return;
    }
    renderEjercicio(state);
    goScreen('ejercicio');
  }).catch(showError).then(hideLoading);
}

function renderEjercicio(state) {
  var current = state.current;
  var ex = state.exercises.filter(function (e) { return e.id === current.exerciseId; })[0];
  if (!ex) { showError(new Error('No se pudo cargar el ejercicio actual. Vuelve a Hoy e inténtalo de nuevo.')); goHoy(); return; }
  var idx = state.exercises.indexOf(ex) + 1;
  el('ejercicioTitleBar').textContent = 'Ejercicio ' + idx + ' / ' + state.exercises.length;

  var repRangeLabel = (ex.min_reps != null && ex.max_reps != null)
    ? (ex.min_reps + '–' + ex.max_reps + ' reps')
    : (esc(ex.reps_planned) + ' reps');
  var rirLabel = '';
  if (ex.target_rir_min != null && ex.target_rir_max != null) {
    rirLabel = (Number(ex.target_rir_min) === Number(ex.target_rir_max))
      ? (' · RIR ' + ex.target_rir_min) : (' · RIR ' + ex.target_rir_min + '–' + ex.target_rir_max);
  }
  var categoryTag = ex.category === 'ACCESORIO' ? ' <span class="pill" style="font-size:10.5px;padding:3px 9px;vertical-align:middle;">Accesorio</span>' : '';
  var defaultRir = (ex.target_rir_min != null && ex.target_rir_max != null)
    ? Math.round((Number(ex.target_rir_min) + Number(ex.target_rir_max)) / 2) : '';

  var html =
    '<div class="session-clock" id="ejSessionClock">⏱ Sesión 00:00</div>' +
    '<div class="center" style="margin-top:14px;"><div class="h1" style="font-size:30px;">' + esc(ex.exercise_name) + categoryTag + '</div>' +
    '<div class="sub" style="font-size:15px;">' + repRangeLabel + rirLabel + ' · <b style="color:var(--primary-darker);">' + esc(weightLabel(ex.weight_planned, ex.weight_type, ex.unit)) + '</b></div></div>' +
    '<div class="card center"><div class="timer-label">Serie</div><div class="timer-big small">' + (current.setNumber - 1) + ' / ' + ex.sets_planned + '</div></div>' +
    '<div class="card">' +
    '<div class="btn-row" style="margin-bottom:10px;">' +
    '<div class="field mb0" style="flex:1;"><label>Peso real</label><input type="number" step="0.5" id="inpWeightActual" value="' + (ex.weight_planned || 0) + '"></div>' +
    '<div class="field mb0" style="flex:1;"><label>Reps reales</label><input type="number" id="inpRepsActual" value="' + (parseInt(ex.reps_planned, 10) || '') + '"></div>' +
    '</div>' +
    '<div class="field mb0" style="margin-bottom:10px;"><label>RIR real (reps en reserva)</label><input type="number" min="0" max="5" id="inpRirActual" value="' + defaultRir + '" placeholder="0 = fallo"></div>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--danger);font-weight:700;"><input type="checkbox" id="chkFail"> Marcar como fallo</label>' +
    '</div>';
  el('ejercicioContent').innerHTML = html;
  el('ejercicioCta').innerHTML =
    '<button class="btn btn-outline" onclick="onSkipExerciseClick(\'' + ex.id + '\')">Omitir ejercicio</button>' +
    '<button class="btn btn-primary" onclick="onCompleteSetClick(\'' + ex.id + '\', ' + current.setNumber + ')">✓ Completar serie</button>';
  startGlobalClockTicker_('ejSessionClock');
}

function onCompleteSetClick(exerciseId, setNumber) {
  var weight = Number(el('inpWeightActual').value);
  var reps = Number(el('inpRepsActual').value);
  var failed = el('chkFail').checked;
  var rirEl = el('inpRirActual');
  var rirActual = (rirEl && rirEl.value !== '') ? Number(rirEl.value) : (failed ? 0 : null);
  showLoading();
  gs('logSet', exerciseId, setNumber, weight, reps, failed ? 'FAILED' : 'COMPLETED', '', rirActual).then(function (res) {
    vibrate(30);
    if (res.sessionAutoCompleted) { finishAndShowResult_(res.finishResult); return; }
    goToCurrentStep();
  }).catch(showError).then(hideLoading);
}

function onSkipExerciseClick(exerciseId) {
  confirmDialog('¿Omitir este ejercicio?', 'Quedará registrado como omitido.', 'Omitir', function () {
    showLoading();
    gs('skipExercise', exerciseId).then(function (res) {
      if (res.sessionAutoCompleted) { finishAndShowResult_(res.finishResult); return; }
      goToCurrentStep();
    }).catch(showError).then(hideLoading);
  });
}

/* ============================================================================================
 * 6. DESCANSO
 * ==========================================================================================*/

function renderDescanso(rest) {
  el('descansoContent').innerHTML =
    '<div class="session-clock" id="descSessionClock">⏱ Sesión 00:00</div>' +
    '<div class="timer-ring"><div class="timer-label">Descanso</div><div class="timer-big small" id="restCountdown">00:00</div></div>' +
    '<div class="hint">Sonido y vibración al finalizar · cuenta atrás final de 3s</div>' +
    '<div class="center" style="margin-top:16px;"><button class="btn btn-outline" style="width:auto;padding:14px 26px;" onclick="onSkipRestClick()">⏭ Saltar descanso</button></div>';
  startGlobalClockTicker_('descSessionClock');
  startRestTicker_(rest.restEndTime);
}

var restBeepedFinal = false;
function startRestTicker_(restEndTimeIso) {
  clearInterval(APP.timers.rest);
  restBeepedFinal = false;
  var lastWholeSecond = null;
  function tick() {
    var remaining = Math.round((new Date(restEndTimeIso).getTime() - Date.now()) / 1000);
    if (remaining <= 0) {
      el('restCountdown').textContent = '00:00';
      if (!restBeepedFinal) { restBeepedFinal = true; beepFinal(); vibrate([120, 60, 120]); }
      clearInterval(APP.timers.rest);
      setTimeout(function () { onSkipRestClick(); }, 500);
      return;
    }
    if (remaining <= 3 && remaining !== lastWholeSecond) { beepCountdownTick(); vibrate(40); }
    lastWholeSecond = remaining;
    el('restCountdown').textContent = formatMMSS(remaining);
  }
  tick();
  APP.timers.rest = setInterval(tick, 250);
}

function onSkipRestClick() {
  clearInterval(APP.timers.rest);
  showLoading();
  gs('skipRestNow', APP.currentSessionId).then(function () { goToCurrentStep(); }).catch(showError).then(hideLoading);
}

/* ============================================================================================
 * 7. PAUSA
 * ==========================================================================================*/

function onPauseClick() {
  showLoading();
  gs('pauseSession', APP.currentSessionId).then(function () {
    releaseWakeLock_();
    return refreshSessionState_();
  }).then(function (state) {
    renderPausa(state);
    goScreen('pausa');
  }).catch(showError).then(hideLoading);
}

function renderPausa(state) {
  el('pausaContent').innerHTML =
    '<div class="center" style="padding-top:30px;"><div style="font-size:46px;">⏸</div>' +
    '<div class="h1">Entrenamiento en pausa</div>' +
    '<p class="sub">El tiempo de pausa no cuenta para el cronómetro global.</p></div>' +
    '<div class="card"><div class="row-between"><span class="ex-meta">Tiempo activo hasta ahora</span><b>' + formatMMSS(state.activeElapsedSeconds) + '</b></div></div>';
}

function onResumeClick() {
  showLoading();
  gs('resumeSession', APP.currentSessionId).then(function () { requestWakeLock_(); goToCurrentStep(); }).catch(showError).then(hideLoading);
}

/* ============================================================================================
 * 8. WOD — motor genérico. structure define el comportamiento; el cliente calcula todo a
 * partir de marcas de tiempo (startedAt), nunca de contadores guardados, para que sobreviva
 * a un cierre accidental del navegador.
 * ==========================================================================================*/

function openWod() {
  showLoading();
  refreshSessionState_().then(function (state) {
    var wod = state.wod;
    if (!wod) { finishAndShowResult_(); return; }
    if (wod.status === 'NOT_STARTED') {
      return gs('startWod', APP.currentSessionId).then(function () { return refreshSessionState_(); }).then(function (s2) { renderWod_(s2.wod); goScreen('wod'); });
    }
    renderWod_(wod);
    goScreen('wod');
  }).catch(showError).then(hideLoading);
}

function renderWod_(wod) {
  APP.wod = { type: wod.wod_type, structure: wod.structure, startedAt: wod.started_at, exercises: getWodExercisesFromToday_() };
  clearInterval(APP.timers.wod);
  var movesHtml = APP.wod.exercises.map(function (m) {
    return '<div class="wod-move"><span>' + esc(m.reps) + ' ' + esc(m.exercise_name) + '</span><span>' + esc(weightLabel(m.weight_value, m.weight_type, m.unit)) + '</span></div>';
  }).join('');

  var header = '<div class="center"><span class="badge badge-info">' + wodBadgeLabel_(wod.wod_type, wod.structure) + '</span></div>';
  var body = '<div id="wodTimerZone"></div><div class="card">' + movesHtml + '</div><div id="wodExtra"></div>';
  el('wodContent').innerHTML = header + body;

  var type = wod.wod_type;
  if (type === 'AMRAP') runAmrapEngine_(wod);
  else if (type === 'FOR_TIME' || type === 'ROUNDS' || type === 'LADDER_21_15_9' || type === 'RFT' || type === 'CHIPPER') runForTimeEngine_(wod);
  else if (type === 'EMOM' || type === 'INTERVALS') runEmomEngine_(wod);
  else if (type === 'TABATA') runTabataEngine_(wod);
  else runManualResultEngine_(wod); // MAX_REPS, TIME, DISTANCE

  el('wodCta').innerHTML =
    '<button class="btn btn-outline" onclick="onSkipWodClick()">Omitir WOD</button>' +
    '<button class="btn btn-primary" id="wodFinishBtn" onclick="onFinishWodClick()">Finalizar WOD</button>';
}

function getWodExercisesFromToday_() {
  if (APP.today && APP.today.wod) return APP.today.wod.exercises;
  return [];
}
function wodBadgeLabel_(type, s) {
  if (type === 'AMRAP') return 'AMRAP ' + formatMMSS(s.duration_seconds);
  if (type === 'EMOM') return 'EMOM ' + s.total_minutes + "'";
  if (type === 'TABATA') return 'TABATA · ' + s.rounds + ' rondas';
  if (type === 'FOR_TIME') return 'FOR TIME · ' + (s.rounds || '') + ' rondas';
  if (type === 'LADDER_21_15_9') return '21-15-9';
  if (type === 'ROUNDS') return 'RONDAS · ' + (s.rounds || '');
  if (type === 'RFT') return (s.rounds || '') + ' RONDAS FOR TIME';
  if (type === 'CHIPPER') return 'CHIPPER';
  if (type === 'INTERVALS') return 'INTERVALOS';
  if (type === 'MAX_REPS') return 'MÁXIMAS REPETICIONES';
  return type;
}

function elapsedWodSeconds_() {
  return Math.round((Date.now() - new Date(APP.wod.startedAt).getTime()) / 1000);
}

/* AMRAP: cuenta atrás única; al llegar a 0, se pide registrar rondas + reps extra. */
function runAmrapEngine_(wod) {
  function tick() {
    var remaining = wod.structure.duration_seconds - elapsedWodSeconds_();
    if (remaining <= 0) {
      el('wodTimerZone').innerHTML = '<div class="timer-ring"><div class="timer-label">Tiempo</div><div class="timer-big small">00:00</div></div>';
      if (!APP._amrapEnded) { APP._amrapEnded = true; beepFinal(); vibrate([150, 80, 150]); }
      clearInterval(APP.timers.wod);
      return;
    }
    if (remaining <= 3) beepCountdownTick();
    el('wodTimerZone').innerHTML = '<div class="timer-ring"><div class="timer-label">Tiempo restante</div><div class="timer-big small">' + formatMMSS(remaining) + '</div></div>';
  }
  APP._amrapEnded = false;
  tick();
  APP.timers.wod = setInterval(tick, 1000);
}

/* FOR TIME / ROUNDS / 21-15-9: cronómetro ascendente + botón TAP opcional para contar rondas. */
var wodTapCount = 0;
function runForTimeEngine_(wod) {
  wodTapCount = 0;
  function tick() {
    var elapsed = elapsedWodSeconds_();
    var cap = wod.structure.cap_seconds;
    var overCap = cap && elapsed >= cap;
    el('wodTimerZone').innerHTML = '<div class="timer-ring' + (overCap ? '' : '') + '"><div class="timer-label">' + (overCap ? 'Tiempo tope alcanzado' : 'Tiempo transcurrido') + '</div><div class="timer-big small">' + formatMMSS(elapsed) + '</div></div>';
  }
  tick();
  APP.timers.wod = setInterval(tick, 1000);
  el('wodExtra').innerHTML = '<div class="center" style="margin:14px 0;"><button class="btn btn-secondary" style="width:auto;padding:14px 30px;" onclick="wodTap_()">Ronda <span id="wodTapCount">0</span> · TAP</button></div>';
}
function wodTap_() { wodTapCount++; el('wodTapCount').textContent = wodTapCount; vibrate(20); }

/* EMOM / INTERVALS: controla minutos/intervalos automáticamente. */
function runEmomEngine_(wod) {
  var moves = APP.wod.exercises.length > 0 ? APP.wod.exercises : [{ exercise_name: 'Trabajo' }];
  var interval = wod.structure.interval_seconds || 60;
  var totalUnits = wod.structure.total_minutes || wod.structure.rounds || 10;
  function tick() {
    var elapsed = elapsedWodSeconds_();
    var unitIndex = Math.floor(elapsed / interval);
    var into = elapsed % interval;
    var remaining = interval - into;
    if (unitIndex >= totalUnits) {
      el('wodTimerZone').innerHTML = '<div class="emom-current"><div class="lbl">Terminado</div><div class="move">¡Buen trabajo!</div></div>';
      if (!APP._emomEnded) { APP._emomEnded = true; beepFinal(); vibrate([150, 80, 150]); }
      clearInterval(APP.timers.wod);
      return;
    }
    if (into === 0) { beepCountdownTick(); vibrate(60); }
    var move = moves[unitIndex % moves.length];
    el('wodTimerZone').innerHTML = '<div class="emom-current"><div class="lbl">Minuto ' + (unitIndex + 1) + ' de ' + totalUnits + '</div>' +
      '<div class="move">' + esc(move.reps || '') + ' ' + esc(move.exercise_name) + '</div>' +
      '<div class="timer-big small" style="color:#fff;margin:6px 0 0;">' + formatMMSS(remaining) + '</div></div>';
  }
  APP._emomEnded = false;
  tick();
  APP.timers.wod = setInterval(tick, 1000);
}

/* TABATA: intervalos trabajo/descanso con cambio automático. */
function runTabataEngine_(wod) {
  var work = wod.structure.work_seconds, rest = wod.structure.rest_seconds, rounds = wod.structure.rounds;
  var cycle = work + rest;
  function tick() {
    var elapsed = elapsedWodSeconds_();
    var roundIndex = Math.floor(elapsed / cycle);
    var into = elapsed % cycle;
    if (roundIndex >= rounds) {
      el('wodTimerZone').innerHTML = '<div class="timer-ring"><div class="tabata-phase">¡Terminado!</div></div>';
      if (!APP._tabataEnded) { APP._tabataEnded = true; beepFinal(); vibrate([150, 80, 150]); }
      clearInterval(APP.timers.wod);
      return;
    }
    var inWork = into < work;
    var remaining = inWork ? (work - into) : (cycle - into);
    if (into === 0) { beepCountdownTick(); vibrate(60); }
    if (!inWork && into === work) { beepCountdownTick(); vibrate(40); }
    el('wodTimerZone').innerHTML = '<div class="center"><span class="badge badge-info">Ronda ' + (roundIndex + 1) + ' / ' + rounds + '</span></div>' +
      '<div class="timer-ring" style="border-top-color:' + (inWork ? 'var(--success)' : 'var(--warning)') + ';">' +
      '<div class="tabata-phase ' + (inWork ? 'tabata-work' : 'tabata-rest') + '">' + (inWork ? 'TRABAJO' : 'DESCANSO') + '</div>' +
      '<div class="timer-big small">' + formatMMSS(remaining) + '</div></div>';
  }
  APP._tabataEnded = false;
  tick();
  APP.timers.wod = setInterval(tick, 1000);
}

/* MAX_REPS / TIME / DISTANCE: sin temporizador automático obligatorio, resultado manual. */
function runManualResultEngine_(wod) {
  el('wodTimerZone').innerHTML = '<div class="hint">Introduce el resultado cuando termines.</div>';
}

function onFinishWodClick() {
  clearInterval(APP.timers.wod);
  var type = APP.wod.type;
  var result = {};
  if (type === 'AMRAP') {
    var rounds = prompt('¿Cuántas rondas completas hiciste?', '0');
    if (rounds === null) { return; }
    var extra = prompt('¿Reps extra en la ronda incompleta? (0 si ninguna)', '0');
    result = { rounds: Number(rounds) || 0, extraReps: Number(extra) || 0 };
  } else if (type === 'FOR_TIME' || type === 'ROUNDS' || type === 'LADDER_21_15_9' || type === 'RFT' || type === 'CHIPPER') {
    result = { timeSeconds: elapsedWodSeconds_(), rounds: wodTapCount };
  } else if (type === 'MAX_REPS') {
    var reps = prompt('¿Cuántas repeticiones totales?', '0');
    if (reps === null) return;
    result = { reps: Number(reps) || 0 };
  } else if (type === 'TIME') {
    var t = prompt('Tiempo final (segundos):', String(elapsedWodSeconds_()));
    if (t === null) return;
    result = { timeSeconds: Number(t) || 0 };
  } else if (type === 'DISTANCE') {
    var dist = prompt('Distancia recorrida (metros):', '0');
    if (dist === null) return;
    result = { distanceMeters: Number(dist) || 0 };
  } else {
    result = { rounds: wodTapCount, elapsedSeconds: elapsedWodSeconds_() };

  showLoading();
  gs('finishWod', APP.currentSessionId, 'COMPLETED', result, '').then(function (res) { finishAndShowResult_(res.finishResult); }).catch(showError).then(hideLoading);
}

/* ============================================================================================
 * 9. RESULTADO (completado / incompleto) y finalización anticipada
 * ==========================================================================================*/

/* precomputed: si la sesión ya se cerró antes de llamar acá (auto-completada al registrar el
 * último set, al saltar el último ejercicio, o al terminar el WOD), viene con el resultado real
 * de finishSession (incluyendo phaseCompleted/nextPhaseSuggestion si corresponde) — así se evita
 * llamar a finishSession dos veces y perder esa información en el segundo llamado (que solo
 * devolvería {alreadyFinished:true}). Si no viene, es un cierre manual (botón "Finalizar
 * entrenamiento") y se llama a finishSession acá por primera y única vez. */
function finishAndShowResult_(precomputed) {
  if (precomputed && precomputed.status) {
    stopGlobalClockTicker_();
    releaseWakeLock_();
    return renderResultado_(precomputed.status, precomputed);
  }
  showLoading();
  return gs('finishSession', APP.currentSessionId, '').then(function (res) {
    stopGlobalClockTicker_();
    releaseWakeLock_();
    return renderResultado_(res.status, res);
  }).catch(showError).then(hideLoading);
}

function renderResultado_(status, finishInfo) {
  return refreshSessionState_().then(function (state) {
    var s = state.session;
    var exercisesDone = state.exercises.filter(function (e) { return e.status === 'COMPLETED' || e.status === 'SKIPPED'; }).length;
    var wodBadge = !state.wod ? '—' : (state.wod.status === 'COMPLETED' ? '✓' : (state.wod.status === 'SKIPPED' ? 'Omitido' : 'Pendiente'));
    var isComplete = status === 'COMPLETED';
    var phaseHtml = '';
    if (finishInfo && finishInfo.phaseCompleted) {
      phaseHtml = '<div class="card" style="border-color:var(--primary);text-align:center;">' +
        '<div style="font-size:32px;">🏆</div>' +
        '<div class="h1" style="font-size:19px;">¡Felicidades! Terminaste la fase "' + esc(finishInfo.finishedPhaseName) + '"</div>' +
        (finishInfo.nextPhaseSuggestion ?
          '<p class="sub">Según tu rotación, ahora toca: <b style="color:var(--primary-darker);">' + esc(finishInfo.nextPhaseSuggestion) + '</b></p>' +
          '<button class="btn btn-secondary" style="width:auto;padding:12px 22px;margin-top:6px;" onclick="goScreen(\'fases\')">Ir a Fases</button>' :
          '<p class="sub">Cuando tengas la próxima fase lista, activala desde la pantalla Fases.</p>') +
        '</div>';
    }
    var html = phaseHtml +
      '<div class="center" style="font-size:44px;">' + (isComplete ? '✅' : '⚠️') + '</div>' +
      '<div class="h1 center">' + (isComplete ? '¡Entrenamiento completado!' : 'Entrenamiento incompleto') + '</div>' +
      '<p class="sub center">' + esc(s.day_name) + '</p>' +
      '<div class="kpi-row"><div class="kpi"><div class="num">' + formatMMSS(state.activeElapsedSeconds) + '</div><div class="lbl">Tiempo total</div></div>' +
      '<div class="kpi"><div class="num">' + exercisesDone + '/' + state.exercises.length + '</div><div class="lbl">Ejercicios</div></div>' +
      '<div class="kpi"><div class="num">' + wodBadge + '</div><div class="lbl">WOD</div></div></div>' +
      '<div class="card">' + state.exercises.map(function (e) {
        var badge = e.status === 'COMPLETED' ? '<span class="badge badge-success">Completo</span>' :
          e.status === 'SKIPPED' ? '<span class="badge badge-warning">Omitido</span>' :
          '<span class="badge badge-neutral">' + (e.sets.length) + '/' + e.sets_planned + ' series</span>';
        return '<div class="ex-item"><span>' + esc(e.exercise_name) + '</span>' + badge + '</div>';
      }).join('') + '</div>' +
      '<div class="field"><label>Nota de la sesión (opcional)</label><textarea rows="2" id="inpSessionNote" placeholder="Ej. hoy dormí mal…">' + esc(s.session_note || '') + '</textarea></div>';
    el('resultadoContent').innerHTML = html;
    goScreen('resultado');
  });
}

function onCsvFileSelected_(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    APP.csvText = e.target.result;
    showLoading();
    var previewCall = importMode === 'new'
      ? gs('previewImportCsv', APP.csvText, (el('impPhaseName').value || file.name.replace(/\.csv$/i, '')))
      : gs('previewImportIntoActivePhase', APP.csvText);
    previewCall.then(function (preview) {
      var s = preview.summary;
      var warn = (importMode === 'new' && preview.phaseNameAlreadyExists) ? '<div class="banner-warning">Ya existe una fase con ese nombre. Se creará otra distinta (no se sobrescribe nada).</div>' : '';
      el('impPreview').innerHTML = '<div class="section-label">Previsualización de importación</div>' +
        '<div class="card"><div class="ex-item"><span>Días programados</span><span class="ex-right">' + s.days + '</span></div>' +
        '<div class="ex-item"><span>Ejercicios</span><span class="ex-right">' + s.exercises + '</span></div>' +
        '<div class="ex-item"><span>WODs</span><span class="ex-right">' + s.wods + '</span></div>' +
        '<div class="ex-item"><span>Calentamientos</span><span class="ex-right">' + s.warmupItems + '</span></div>' +
        '<div class="ex-item"><span>RMs</span><span class="ex-right">' + s.rms + '</span></div></div>' + warn +
        (importMode === 'new' && preview.currentActivePhaseName ? '<div class="banner-warning">La fase "' + esc(preview.currentActivePhaseName) + '" pasará a estar archivada. Su historial y programación se conservan intactos.</div>' : '');
      el('importarCta').innerHTML = '<button class="btn btn-outline" onclick="renderImportar()">Cancelar</button><button class="btn btn-primary" onclick="onConfirmImportClick_()">Confirmar importación</button>';
    }).catch(showError).then(hideLoading);
  };
  reader.readAsText(file);
}

function onConfirmImportClick_() {
  showLoading();
  if (importMode === 'new') {
    var phaseName = el('impPhaseName').value.trim();
    if (!phaseName) { showError(new Error('Ponle un nombre a la fase.')); hideLoading(); return; }
    var weeks = Number(el('impWeeks').value) || 6;
    var desc = el('impDesc').value;
    gs('confirmImportCsv', APP.csvText, phaseName, weeks, desc).then(function () {
      showToast('Fase "' + phaseName + '" importada y activada.');
      APP.csvText = null;
      return loadToday();
    }).then(function () { goScreen('fases'); renderFases(); }).catch(showError).then(hideLoading);
  } else {
    gs('confirmImportIntoActivePhase', APP.csvText).then(function () {
      showToast('Programación añadida a la fase activa.');
      APP.csvText = null;
      return loadToday();
    }).then(function () { goScreen('fases'); renderFases(); }).catch(showError).then(hideLoading);
  }
}

/* ============================================================================================
 * 14. AJUSTES
 * ==========================================================================================*/

function renderAjustes() {
  el('ajustesContent').innerHTML =
    '<div class="card"><div class="row-between"><span>Sonido de temporizadores</span><button class="toggle ' + (APP.config.soundOn ? '' : 'off') + '" onclick="onToggleConfig_(\'sound_on\')"></button></div>' +
    '<div class="divider"></div><div class="row-between"><span>Vibración</span><button class="toggle ' + (APP.config.vibrationOn ? '' : 'off') + '" onclick="onToggleConfig_(\'vibration_on\')"></button></div></div>' +
    '<div class="section-label">Programación</div><div class="card stack">' +
    '<button class="btn btn-outline btn-sm" onclick="goScreen(\'fases\')">Gestionar fases</button>' +
    '<button class="btn btn-outline btn-sm" onclick="goScreen(\'importar\'); renderImportar();">Importar CSV</button></div>';
}

function onToggleConfig_(key) {
  var current = key === 'sound_on' ? APP.config.soundOn : APP.config.vibrationOn;
  var next = !current;
  if (key === 'sound_on') APP.config.soundOn = next; else APP.config.vibrationOn = next;
  renderAjustes();
  gs('setConfig', key, next).catch(showError);
}

/* ============================================================================================
 * Modal genérico (confirmaciones)
 * ==========================================================================================*/

function openModal(bodyHtml, buttons) {
  var btnsHtml = buttons.map(function (b, i) { return '<button class="btn ' + b.cls + '" id="modalBtn' + i + '" style="margin-top:' + (i === 0 ? '6' : '0') + 'px;">' + b.label + '</button>'; }).join('');
  el('modalRoot').innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card">' + bodyHtml + '<div class="stack" style="margin-top:14px;">' + btnsHtml + '</div></div></div>';
  buttons.forEach(function (b, i) { el('modalBtn' + i).onclick = b.action; });
}
function closeModal() { el('modalRoot').innerHTML = ''; }
function confirmDialog(title, subtitle, confirmLabel, onConfirm) {
  var body = '<div class="h2 center">' + esc(title) + '</div><p class="sub center">' + esc(subtitle) + '</p>';
  openModal(body, [
    { label: 'Cancelar', cls: 'btn-outline', action: closeModal },
    { label: confirmLabel, cls: 'btn-danger', action: function () { closeModal(); onConfirm(); } }
  ]);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* no debe romper la app si falla */ });
  });
}
</script>
